name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          CC: ${{ matrix.compiler }}
        run: |
          make clean
          make
      - name: Run completed phase tests
        env:
          CC: ${{ matrix.compiler }}
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan
        env:
          CC: clang
        run: make sanitize

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
      - name: Run clang-tidy
        run: make lint
